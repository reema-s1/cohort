spring:
  application:
    name: cohort-server
  datasource:
    url: ${COHORT_DB_URL:jdbc:postgresql://localhost:5432/cohort}
    username: ${COHORT_DB_USER:cohort}
    password: ${COHORT_DB_PASSWORD:cohort}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${COHORT_KAFKA_SERVERS:localhost:29092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        linger.ms: 5
        spring.json.add.type.headers: false
    consumer:
      group-id: cohort-aggregator
      auto-offset-reset: earliest
      max-poll-records: 1000
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: dev.cohort.common.CohortEvent
        spring.json.use.type.headers: false
    listener:
      type: batch
      # Offsets are committed only after the listener returns, i.e. after the DB transaction commits.
      ack-mode: batch
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful

cohort:
  security:
    admin-key: ${COHORT_ADMIN_KEY:dev-admin-key}
    sdk-key: ${COHORT_SDK_KEY:dev-sdk-key}
  events:
    topic: cohort.events
    partitions: 6

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html
